name: atleta_app
description: "App dell'atleta di Open Coach."
publish_to: 'none'
# La versione che l'app dichiara al coach (§6.3): sotto `versione_app_minima`
# il coach risponde 426.
version: 1.6.0+8

environment:
  sdk: ^3.11.5

dependencies:
  atleta_nucleo:
    path: ../nucleo
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_zxing: ^3.1.0
  image_picker: ^1.2.4
  intl: any
  path_provider: ^2.1.6
  protocollo:
    path: ../../pacchetti/protocollo
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
